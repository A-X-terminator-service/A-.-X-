<style>
@font-face{
    font-family:'Ax-Regular';
    src:url('Ax-Regular.ttf.otf') format('opentype');
}
.back-btn{
    position:fixed;
    bottom:20px;
    left:20px;

    background:#ff0000;
    color:#000;
    border:none;

    padding:12px 20px;

    font-family:'Ax-Regular';

.back-btn:hover{

*{

    padding:0;

}

body{

    display:flex;

    align-items:flex-start;

    padding-top:80px;
}

/* ligne de dossiers */
.images{
    display:flex;
    gap:100px;
}

/* bloc dossier */
.folder{
    text-align:center;
}

/* lien complet cliquable */
.folder a{
    text-decoration:none;
    color:red;
    display:block;
}

/* image */
.folder img{
    width:120px;
    display:block;
}

/* texte */
.folder p{
    margin-top:10px;
    font-size:25px;
}

/* petit effet au toucher */
.folder:hover{
    transform:scale(1.05);
    transition:0.3s;
}
</style>
