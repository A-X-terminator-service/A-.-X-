<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Contracts</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@font-face{font-family:'Ax-Regular';src:url('Ax-Regular.ttf.otf') format('opentype')}*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#ff0000;font-family:'Ax-Regular',sans-serif;min-height:100vh}.top-bar{height:80px;background:#0a0a0a;display:flex;justify-content:space-between;align-items:center;padding:0 25px;border-bottom:3px solid #f00}.left-icons,.right-icons{display:flex;gap:20px}.top-bar img{width:45px;height:45px;cursor:pointer;transition:.2s}.top-bar img:hover{opacity:.8}.market-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:20px;padding:30px 25px}.market-card{background:#0d0d0d;border:2px solid #f00;padding:20px;color:#fff;transition:.2s}.market-card:hover{box-shadow:0 0 15px rgba(255,0,0,.3)}.card-img{width:100%;height:200px;background:#111;border:1px solid #f00;margin-bottom:15px;overflow:hidden}.card-img img{width:100%;height:100%;object-fit:cover}.market-card h2{font-size:1.3rem;color:#f00;margin-bottom:10px}.market-card p{line-height:1.6;margin:10px 0;color:#ccc}.conditions{background:#111;border-left:3px solid #f00;padding:12px 15px;margin:15px 0}.conditions h3{color:#f00;font-size:.95rem;margin-bottom:8px}.condition-row{display:flex;align-items:center;gap:10px;margin:8px 0;cursor:pointer}.condition-row input{cursor:pointer}.condition-row span{color:#ccc}.proof-text{width:100%;min-height:90px;background:#111;border:1px solid #f00;color:#fff;padding:12px;font-family:inherit;resize:vertical;margin:10px 0}.proof-file{display:block;margin:10px 0;padding:8px}.submit-btn,.abandon-btn{width:100%;padding:12px;margin-top:10px;font-family:inherit;cursor:pointer;border:none}.submit-btn{background:#f00;color:#000;font-weight:bold}.submit-btn:hover{opacity:.9}.abandon-btn{background:#000;color:#f00;border:2px solid #f00}.abandon-btn:hover{background:#f00;color:#000}.reason-select{width:100%;padding:8px;margin:10px 0;background:#111;color:#fff;border:1px solid #f00;font-family:inherit}.pending{background:#333;color:#f0f000;padding:12px;border:1px solid #f0f000;margin:10px 0}.rejected{background:#330000;color:#ff6666;padding:12px;border:1px solid #ff6666;margin:10px 0}.empty-text{text-align:center;padding:40px;color:#777;font-size:1.1rem}.back-btn{position:fixed;bottom:20px;right:20px;background:#f00;color:#000;padding:12px 20px;border:none;cursor:pointer;font-family:inherit;font-weight:bold;transition:.2s}.back-btn:hover{background:#ff3333}.loading{text-align:center;padding:40px;color:#ff0000}.error{background:#330000;color:#ff6666;padding:15px;margin:10px;border:1px solid #ff6666}
</style></head><body>
<div class="top-bar"><div class="left-icons"><img src="file.png" width="40" height="35" onclick="window.location.replace('filepage.html')"><img src="Hunterid.png" width="45" height="35" onclick="window.location.replace('hunterinfo.html')"><img src="Iconecontrat.png" width="45" height="40" onclick="window.location.replace('Contrats.html')"></div><div style="flex:1;text-align:center;font-size:1.8rem;color:#f00">MY CONTRACTS</div><div class="right-icons"></div></div>
<div id="contracts-container" class="market-grid"><div class="loading">LOADING...</div></div><button class="back-btn" onclick="window.location.replace('Market.html')">← MARKET</button>
<script>
// Load credentials from environment variables
const SUPABASE_URL=import.meta.env.VITE_SUPABASE_URL||'';
const SUPABASE_KEY=import.meta.env.VITE_SUPABASE_ANON_KEY||'';
if(!SUPABASE_URL||!SUPABASE_KEY){console.error('SUPABASE credentials not configured');document.getElementById('contracts-container').innerHTML='<div class="error">CONFIG ERROR: Missing Supabase credentials</div>'}
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let user=null,contracts=[];
async function start(){const {data,error}=await db.auth.getSession();if(error||!data.session){window.location.replace('index.html');return}user=data.session.user;await loadContracts()}
async function loadContracts(){const {data,error}=await db.from('contracts').select('id,announcement_id,hunter_id,status,submitted_at,proof_text,proof_data,verification_note,condition_checks,created_at,announcements(title,description,reward,image_url,conditions,required_kills)').eq('hunter_id',user.id).order('created_at',{ascending:false});if(error){console.error(error);document.getElementById('contracts-container').innerHTML='<div class="error">ERROR LOADING CONTRACTS</div>';return}contracts=data||[];renderContracts()}
function renderContracts(){const c=document.getElementById('contracts-container');c.innerHTML='';if(!contracts.length){c.innerHTML='<div class="empty-text">NO ACTIVE CONTRACTS</div>';return}contracts.forEach(contract=>{const a=contract.announcements||{};const card=document.createElement('div');card.className='market-card';if(a.image_url){const img=document.createElement('img');img.src=a.image_url;img.className='card-img';img.alt=a.title||'Contract';card.appendChild(img)}else{const e=document.createElement('div');e.className='card-img';card.appendChild(e)}const title=document.createElement('h2');title.textContent=a.title||'Untitled contract';card.appendChild(title);const desc=document.createElement('p');desc.style.margin='15px 0';desc.textContent=a.description||'';card.appendChild(desc);const reward=document.createElement('p');reward.textContent='Reward : '+(a.reward||'Not specified');card.appendChild(reward);const kill=document.createElement('p');kill.style.marginTop='10px';kill.textContent='Kills awarded after approval : '+(Number(a.required_kills)||0);card.appendChild(kill);const cond=document.createElement('div');cond.className='conditions';const h=document.createElement('h3');h.textContent='CONDITIONS TO VERIFY';cond.appendChild(h);const conditions=Array.isArray(a.conditions)?a.conditions:[];if(!conditions.length){const p=document.createElement('p');p.textContent='No special conditions specified. Proof is still required.';cond.appendChild(p)}if(contract.status==='active')conditions.forEach((condition,i)=>{const row=document.createElement('label');row.className='condition-row';const check=document.createElement('input');check.type='checkbox';check.dataset.conditionIndex=i;const text=document.createElement('span');text.textContent=condition;row.append(check,text);cond.appendChild(row)});card.appendChild(cond);if(contract.status==='pending_review'){const p=document.createElement('div');p.className='pending';p.textContent='PENDING VERIFICATION — An admin must verify your conditions and proof.';card.appendChild(p);if(contract.proof_text){const t=document.createElement('p');t.style.marginTop='12px';t.textContent='Submitted note : '+contract.proof_text;card.appendChild(t)}}else{if(contract.verification_note){const r=document.createElement('div');r.className='rejected';r.textContent='ADMIN FEEDBACK : '+contract.verification_note;card.appendChild(r)}const proof=document.createElement('textarea');proof.className='proof-text';proof.id='proof-'+contract.id;proof.placeholder='Explain how you completed the conditions. This will be checked by an admin.';card.appendChild(proof);const file=document.createElement('input');file.type='file';file.accept='image/*';file.className='proof-file';file.id='proof-file-'+contract.id;card.appendChild(file);const submit=document.createElement('button');submit.className='submit-btn';submit.textContent='SUBMIT FOR VERIFICATION';submit.onclick=()=>submitForReview(contract.id);card.appendChild(submit);const select=document.createElement('select');select.className='reason-select';select.id='reason-'+contract.id;['Mission too difficult','Reward too low','Lack of time','Personal reasons','Selection mistake','Health issues','Other'].forEach(reason=>{const o=document.createElement('option');o.value=reason;o.textContent=reason;select.appendChild(o)});card.appendChild(select);const abandon=document.createElement('button');abandon.className='abandon-btn';abandon.textContent='ABANDON CONTRACT';abandon.onclick=()=>abandonContract(contract.id);card.appendChild(abandon)}c.appendChild(card)})}
async function submitForReview(id){const contract=contracts.find(x=>x.id===id);if(!contract)return;const card=[...document.querySelectorAll('.market-card')].find(el=>el.querySelector('#proof-'+id));const checked=card?[...card.querySelectorAll('input[type=checkbox][data-condition-index]')]:[];const conditions=Array.isArray(contract.announcements?.conditions)?contract.announcements.conditions:[];if(checked.length!==conditions.length||checked.some(x=>!x.checked))return alert('You must confirm every condition before submitting.');const conditionChecks=conditions.map((_,i)=>checked.find(x=>Number(x.dataset.conditionIndex)===i)?.checked===true);const text=document.getElementById('proof-'+id)?.value.trim()||'';const file=document.getElementById('proof-file-'+id)?.files[0];if(!text&&!file)return alert('Proof is required.');if(file&&file.size>2000000)return alert('Proof image must be smaller than 2 MB.');let data=null;if(file){data=await fileToDataURL(file)}if(!confirm('Submit this contract for admin verification?'))return;const {error}=await db.rpc('submit_contract_for_review',{p_contract_id:id,p_proof_text:text||null,p_proof_data:data,p_condition_checks:conditionChecks});if(error){console.error(error);return alert('SUBMISSION ERROR:\n\n'+error.message)}await loadContracts();alert('SUBMITTED FOR VERIFICATION.')}
function fileToDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(file)})}
async function abandonContract(id){const reason=document.getElementById('reason-'+id)?.value||'Not specified';if(!confirm('Abandon this contract?\n\nReason: '+reason))return;const {error}=await db.rpc('abandon_contract',{p_contract_id:id,p_reason:reason});if(error){console.error(error);return alert('ABANDON ERROR:\n\n'+error.message)}await loadContracts()}
start();
</script></body></html>
