<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>A.X ADMIN TERMINAL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@font-face{font-family:Ax-Regular;src:url('Ax-Regular.ttf.otf') format('opentype')}*{box-sizing:border-box;margin:0;padding:0}body{background:#000;color:#ff0000;font-family:Ax-Regular,Arial,sans-serif;min-height:100vh}.top{height:75px;background:#0a0a0a;border-bottom:3px solid #f00;display:flex;align-items:center;padding:0 20px;gap:20px}.top img{cursor:pointer}.title{flex:1;text-align:center;font-size:2rem}.wrap{max-width:1250px;margin:auto;padding:30px}.denied{display:none;min-height:100vh;align-items:center;justify-content:center;text-align:center;font-size:2rem}.tabs{display:flex;gap:10px;margin-bottom:25px;flex-wrap:wrap}.tab{background:#111;color:#f00;border:2px solid #f00;padding:12px 20px;font-family:inherit;cursor:pointer}.tab.active{background:#f00;color:#000}.section{display:none}.section.active{display:block}.section h2{margin-bottom:18px}.card{background:#090909;border:2px solid #f00;padding:20px;margin-bottom:18px;color:#fff}.card h3{color:#f00;margin-bottom:10px}.meta{color:#aaa;line-height:1.7;margin-bottom:12px}.conditions{border-left:3px solid #f00;padding:10px 15px;margin:12px 0}.conditions li{margin:7px 0}.proof{max-width:100%;max-height:450px;display:block;border:1px solid #f00;margin:12px 0}.note{width:100%;min-height:80px;background:#111;border:1px solid #f00;color:#fff;padding:12px;font-family:inherit;resize:vertical}.actions{display:flex;gap:12px;margin-top:14px}.actions button{flex:1;padding:13px;font-family:inherit;cursor:pointer}.approve{background:#f00;color:#000;border:0}.reject{background:#000;color:#f00;border:2px solid #f00}.empty{text-align:center;border:1px solid #333;padding:35px;color:#777}.history-status{display:inline-block;border:1px solid #f00;padding:5px 10px;margin-bottom:10px;color:#f00}.back{position:fixed;bottom:20px;left:20px;background:#f00;color:#000;border:0;padding:12px 20px;font-family:inherit;cursor:pointer}
</style>
</head><body>
<div id="denied" class="denied"><div>ACCESS DENIED<br><small>ADMIN CLEARANCE REQUIRED</small></div></div>
<div id="app" style="display:none">
<div class="top"><img src="file.png" width="40" height="35" onclick="location.replace('filepage.html')"><img src="Hunterid.png" width="45" height="35" onclick="location.replace('hunterinfo.html')"><img src="Iconecontrat.png" width="45" height="40" onclick="location.replace('Contrats.html')"><div class="title">A.X ADMIN TERMINAL</div></div>
<div class="wrap"><div class="tabs"><button class="tab active" onclick="showTab('review',this)">PENDING VERIFICATION</button><button class="tab" onclick="showTab('abandoned',this)">ABANDONED</button><button class="tab" onclick="showTab('completed',this)">COMPLETED</button></div>
<section id="review" class="section active"><h2>CONTRACTS TO VERIFY</h2><div id="review-list">LOADING...</div></section>
<section id="abandoned" class="section"><h2>ABANDONED CONTRACTS</h2><div id="abandoned-list">LOADING...</div></section>
<section id="completed" class="section"><h2>COMPLETED CONTRACTS</h2><div id="completed-list">LOADING...</div></section>
</div><button class="back" onclick="location.replace('Market.html')">← MARKET</button></div>
<script>
// Load credentials from environment variables
const SUPABASE_URL=import.meta.env.VITE_SUPABASE_URL||'';
const SUPABASE_KEY=import.meta.env.VITE_SUPABASE_ANON_KEY||'';
if(!SUPABASE_URL||!SUPABASE_KEY){console.error('SUPABASE credentials not configured');document.getElementById('denied').innerHTML='<div>CONFIG ERROR: Missing Supabase credentials</div>';document.getElementById('denied').style.display='flex'}
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let profile=null;
async function start(){const s=await db.auth.getSession();if(!s.data.session)return location.replace('index.html');const {data,error}=await db.from('Profiles').select('id,username,is_admin').eq('id',s.data.session.user.id).single();if(error||!data?.is_admin){document.getElementById('denied').style.display='flex';return}profile=data;document.getElementById('app').style.display='block';await Promise.all([loadReviews(),loadHistory('abandoned'),loadHistory('completed')])}
function showTab(id,btn){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');btn.classList.add('active')}
async function loadReviews(){const {data,error}=await db.from('contracts').select('id,announcement_id,hunter_id,status,submitted_at,proof_text,proof_data,verification_note,condition_checks,announcements(title,description,reward,image_url,conditions,required_kills,hunter_username)').eq('status','pending_review').order('submitted_at',{ascending:true});const el=document.getElementById('review-list');if(error){el.textContent='ERROR LOADING REVIEWS: '+error.message;return}if(!data?.length){el.innerHTML='<div class="empty">NO CONTRACTS WAITING FOR VERIFICATION</div>';return}el.innerHTML='';data.forEach(c=>{const a=c.announcements||{};const card=document.createElement('div');card.className='card';card.innerHTML='<h3>'+esc(a.title||'UNTITLED')+'</h3><div class="meta">HUNTER : '+esc(a.hunter_username||c.hunter_id)+'<br>SUBMITTED : '+new Date(c.submitted_at).toLocaleString()+'<br>REWARD : '+esc(a.reward||'—')+'<br>KILLS AFTER APPROVAL : '+(Number(a.required_kills)||0)+'</div>';const box=document.createElement('div');box.className='conditions';const ul=document.createElement('ul');const conditions=Array.isArray(a.conditions)?a.conditions:[];conditions.forEach((x,i)=>{const li=document.createElement('li');li.textContent=(c.condition_checks?.[i]===true?'✓ ':'☐ ')+x;ul.appendChild(li)});box.appendChild(ul);card.appendChild(box);if(c.proof_text){const p=document.createElement('p');p.textContent='HUNTER PROOF: '+c.proof_text;card.appendChild(p)}if(c.proof_data){const img=document.createElement('img');img.src=c.proof_data;img.className='proof';card.appendChild(img)}const note=document.createElement('textarea');note.className='note';note.id='note-'+c.id;note.placeholder='Verification note (optional for approval / required for rejection)...';card.appendChild(note);const actions=document.createElement('div');actions.className='actions';const ok=document.createElement('button');ok.className='approve';ok.textContent='APPROVE CONTRACT';ok.onclick=()=>approve(c.id);const no=document.createElement('button');no.className='reject';no.textContent='REJECT CONTRACT';no.onclick=()=>reject(c.id);actions.append(ok,no);card.appendChild(actions);el.appendChild(card)})}
async function approve(id){const note=document.getElementById('note-'+id)?.value.trim()||null;if(!confirm('APPROVE this contract? This permanently awards the configured kills.'))return;const {error}=await db.rpc('approve_contract',{p_contract_id:id,p_note:note});if(error)return alert('APPROVAL ERROR:\n'+error.message);await Promise.all([loadReviews(),loadHistory('completed')]);alert('CONTRACT APPROVED. KILLS AWARDED.');}
async function reject(id){const note=document.getElementById('note-'+id)?.value.trim();if(!note)return alert('A rejection reason is required.');if(!confirm('Reject this submission?'))return;const {error}=await db.rpc('reject_contract',{p_contract_id:id,p_note:note});if(error)return alert('REJECTION ERROR:\n'+error.message);await loadReviews();alert('CONTRACT REJECTED. The Hunter can resubmit.');}
async function loadHistory(status){const el=document.getElementById(status==='abandoned'?'abandoned-list':'completed-list');const {data,error}=await db.from('contract_history').select('*').eq('status',status).order('created_at',{ascending:false});if(error){el.textContent='ERROR: '+error.message;return}if(!data?.length){el.innerHTML='<div class="empty">NO '+status.toUpperCase()+' CONTRACTS</div>';return}el.innerHTML='';data.forEach(h=>{const card=document.createElement('div');card.className='card';card.innerHTML='<span class="history-status">'+esc(h.status).toUpperCase()+'</span><h3>'+esc(h.title||'UNTITLED')+'</h3><div class="meta">HUNTER : '+esc(h.hunter_username||'Unknown')+'<br>DATE : '+new Date(h.created_at).toLocaleString()+'<br>KILLS AWARDED : '+(Number(h.kills_awarded)||0)+'</div>';if(h.reason){const p=document.createElement('p');p.textContent='REASON : '+h.reason;card.appendChild(p)}if(h.verification_note){const p=document.createElement('p');p.style.marginTop='10px';p.textContent='ADMIN FEEDBACK : '+h.verification_note;card.appendChild(p)}el.appendChild(card)})}
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}start();
</script></body></html>
